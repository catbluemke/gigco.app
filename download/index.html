<script type="text/javascript">
	var system = getMobileOperatingSystem();
	if(system=="iOS"){
		window.location.replace("https://itunes.apple.com/us/app/gigco-escape-the-gig-economy/id1441813538?ls=1&mt=8");
	} else if(system=="Android"||system=="Windows Phone"){
		window.location.replace("https://play.google.com/store/apps/details?id=com.SpekWork.Gigco");
	} else {
		window.location.replace("https://gigco.app");
	}
	

	function getMobileOperatingSystem() {
	  var userAgent = navigator.userAgent || navigator.vendor || window.opera;

	      // Windows Phone must come first because its UA also contains "Android"
	    if (/windows phone/i.test(userAgent)) {
	        return "Windows Phone";
	    }

	    if (/android/i.test(userAgent)) {
	        return "Android";
	    }

	    // iOS detection from: http://stackoverflow.com/a/9039885/177710
	    if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
	        return "iOS";
	    }

	    return "unknown";
	}
</script>
